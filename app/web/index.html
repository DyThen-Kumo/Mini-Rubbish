<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Rubbish – Hỏi đáp CS106</title>
<link rel="icon" href="/assets/images/LOGO_Mini_Rubbish_Stelle.png">
<style>
  /* Màu lấy từ logo: xám than (thùng rác) + vàng (chi tiết áo) */
  :root {
    --bg: #f3f4f6; --panel: #ffffff; --text: #22262d; --muted: #6b7280; --border: #e2e5ea;
    --brand: #3d4654; --accent: #e0a526; --accent-strong: #b9831a; --accent-soft: #fdf3dc; --accent-text: #1f2328;
    --user-bg: #3d4654; --user-text: #ffffff; --bot-bg: #ffffff; --error: #b42318;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c; --panel: #1b1f26; --text: #e7e9ec; --muted: #9aa3af; --border: #2b313a;
      --brand: #c9d1dc; --accent: #f0b93a; --accent-strong: #f0b93a; --accent-soft: #3a2f14; --accent-text: #1a1a1a;
      --user-bg: #3a4352; --user-text: #ffffff; --bot-bg: #20252d; --error: #ff8a7a;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }

  header {
    display: flex; align-items: center; gap: 14px; padding: 10px 20px;
    background: var(--panel); border-bottom: 3px solid var(--accent);
  }
  header img { width: 52px; height: 52px; object-fit: contain; }
  header h1 { margin: 0; font-size: 20px; letter-spacing: .08em; color: var(--brand); }
  header p { margin: 0; color: var(--muted); font-size: 13px; }

  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 330px; }

  .chat { display: flex; flex-direction: column; min-height: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; gap: 10px; align-items: flex-start; }
  .row.user { justify-content: flex-end; }
  .avatar {
    flex: none; width: 36px; height: 36px; border-radius: 50%; object-fit: contain;
    background: var(--accent-soft); border: 1px solid var(--border);
  }
  .msg {
    max-width: min(720px, 78%); padding: 10px 14px; border-radius: 14px;
    white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: var(--shadow);
  }
  .user .msg { background: var(--user-bg); color: var(--user-text); border-bottom-right-radius: 4px; }
  .bot .msg { background: var(--bot-bg); border: 1px solid var(--border); border-top-left-radius: 4px; }
  .msg.error { color: var(--error); }
  .msg.pending { color: var(--muted); font-style: italic; }
  .sources {
    margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--border);
    font-size: 13px; color: var(--muted); white-space: normal;
  }
  .sources strong { color: var(--text); font-weight: 600; }
  .sources ul { margin: 4px 0 0; padding-left: 18px; }

  .empty { margin: auto; text-align: center; color: var(--muted); }
  .empty img { width: 120px; opacity: .9; }
  .empty p { margin: 8px 0 0; }

  form {
    display: flex; gap: 8px; padding: 12px 24px 16px;
    border-top: 1px solid var(--border); background: var(--panel);
  }
  textarea {
    flex: 1; resize: none; height: 46px; padding: 11px 14px; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
  }
  textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  form button {
    padding: 0 22px; font: inherit; font-weight: 700; border: 0; border-radius: 10px;
    background: var(--accent); color: var(--accent-text); cursor: pointer;
  }
  form button:hover:not(:disabled) { filter: brightness(1.05); }
  form button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  aside { border-left: 1px solid var(--border); background: var(--panel); overflow-y: auto; padding: 16px 12px; }
  aside h2 { margin: 0 0 10px 8px; font-size: 12px; letter-spacing: .1em; color: var(--muted); }
  details { margin-bottom: 4px; border-radius: 8px; }
  details[open] { background: var(--bg); }
  summary {
    list-style: none; cursor: pointer; padding: 8px 10px; border-radius: 8px;
    display: flex; gap: 8px; align-items: baseline; font-size: 14px;
  }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "▸"; color: var(--muted); transition: transform .15s; }
  details[open] > summary::before { transform: rotate(90deg); }
  summary:hover { background: var(--bg); }
  .lesson-no { flex: none; font-weight: 700; color: var(--accent-strong); font-variant-numeric: tabular-nums; }
  .lesson-title { font-weight: 600; }
  .toc ul { list-style: none; margin: 0; padding: 0 8px 8px 26px; }
  .download {
    display: inline-flex; align-items: center; gap: 6px; margin: 2px 0 6px; padding: 4px 10px;
    font-size: 13px; font-weight: 600; color: var(--accent-text); text-decoration: none;
    background: var(--accent); border-radius: 999px;
  }
  .download:hover { filter: brightness(1.05); }
  .toc li button {
    width: 100%; text-align: left; padding: 4px 8px; font: inherit; font-size: 13px; color: var(--text);
    background: none; border: 0; border-radius: 6px; cursor: pointer;
  }
  .toc li button:hover { background: var(--panel); color: var(--accent-strong); }

  @media (max-width: 760px) {
    body { height: auto; min-height: 100vh; }
    header { padding: 8px 16px; }
    main { grid-template-columns: 1fr; }
    .chat { height: 75vh; }
    #messages { padding: 16px; }
    form { padding: 10px 16px 14px; }
    aside { border-left: 0; border-top: 1px solid var(--border); }
    .msg { max-width: 85%; }
  }
</style>
</head>
<body>
<header>
  <img src="/assets/images/LOGO_Mini_Rubbish_Stelle.png" alt="Logo Mini Rubbish">
  <div>
    <h1>MINI RUBBISH</h1>
    <p>Hỏi đáp CS106 – Trí tuệ nhân tạo · trả lời dựa trên tài liệu, kèm nguồn</p>
  </div>
</header>
<main>
  <section class="chat">
    <div id="messages" aria-live="polite">
      <div class="empty" id="empty">
        <img src="/assets/images/LOGO_Mini_Rubbish_Stelle.png" alt="">
        <p>Đặt câu hỏi về bài giảng, hoặc chọn một mục trong mục lục.</p>
      </div>
    </div>
    <form id="ask-form">
      <textarea id="question" placeholder="Nhập câu hỏi… (Enter để gửi, Shift+Enter xuống dòng)" maxlength="1000" aria-label="Câu hỏi"></textarea>
      <button id="send" type="submit">Gửi</button>
    </form>
  </section>
  <aside>
    <h2>MỤC LỤC</h2>
    <nav class="toc" id="toc">Đang tải…</nav>
  </aside>
</main>
<script>
const LOGO = "/assets/images/LOGO_Mini_Rubbish_Stelle.png";
const messages = document.getElementById("messages");
const form = document.getElementById("ask-form");
const input = document.getElementById("question");
const sendButton = document.getElementById("send");

const ERROR_TEXT = {
  422: "Câu hỏi rỗng hoặc dài quá 1000 ký tự.",
  429: "Gemini đang hết quota (10 câu/phút). Đợi khoảng 1 phút rồi hỏi lại.",
  502: "Gemini đang lỗi, thử lại sau.",
  503: "Server chưa sẵn sàng: thiếu index hoặc GOOGLE_API_KEY.",
};

// "03_Informed_Search_Summary.txt" → { number: "03", title: "Informed Search" }
function parseLecture(source) {
  const match = source.match(/^([\d-]+)_(.*?)(_Summary)?\.txt$/);
  if (!match) return { number: "", title: source };
  return { number: match[1], title: match[2].replace(/_/g, " ") };
}

function lectureLabel(source) {
  const { number, title } = parseLecture(source);
  return number ? `${number} · ${title}` : title;
}

function addMessage(role, text) {
  document.getElementById("empty")?.remove();
  const row = document.createElement("div");
  row.className = `row ${role}`;
  if (role === "bot") {
    const avatar = document.createElement("img");
    avatar.className = "avatar";
    avatar.src = LOGO;
    avatar.alt = "";
    row.appendChild(avatar);
  }
  const bubble = document.createElement("div");
  bubble.className = "msg";
  bubble.textContent = text;
  row.appendChild(bubble);
  messages.appendChild(row);
  messages.scrollTop = messages.scrollHeight;
  return bubble;
}

function showSources(bubble, sources) {
  if (!sources.length) return;
  const box = document.createElement("div");
  box.className = "sources";
  const heading = document.createElement("strong");
  heading.textContent = "Nguồn";
  const list = document.createElement("ul");
  for (const source of sources) {
    const [file, section] = source.split(" > ");
    const item = document.createElement("li");
    item.textContent = section ? `${lectureLabel(file)} › ${section}` : source;
    list.appendChild(item);
  }
  box.append(heading, list);
  bubble.appendChild(box);
}

async function ask(question) {
  addMessage("user", question);
  const bubble = addMessage("bot", "Đang trả lời…");
  bubble.classList.add("pending");
  sendButton.disabled = true;
  try {
    const response = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    bubble.classList.remove("pending");
    if (!response.ok) {
      bubble.classList.add("error");
      bubble.textContent = ERROR_TEXT[response.status] || `Lỗi ${response.status}.`;
      return;
    }
    const data = await response.json();
    bubble.textContent = data.answer;
    showSources(bubble, data.sources);
  } catch {
    bubble.classList.remove("pending");
    bubble.classList.add("error");
    bubble.textContent = "Không kết nối được server. Kiểm tra uvicorn còn chạy không.";
  } finally {
    sendButton.disabled = false;
    messages.scrollTop = messages.scrollHeight;
    input.focus();
  }
}

form.addEventListener("submit", (event) => {
  event.preventDefault();
  const question = input.value.trim();
  if (!question || sendButton.disabled) return;
  input.value = "";
  ask(question);
});

input.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
    event.preventDefault();
    form.requestSubmit();
  }
});

function renderLecture(lecture) {
  const { number, title } = parseLecture(lecture.source);
  const details = document.createElement("details");

  const summary = document.createElement("summary");
  const no = document.createElement("span");
  no.className = "lesson-no";
  no.textContent = number;
  const name = document.createElement("span");
  name.className = "lesson-title";
  name.textContent = title;
  summary.append(no, name);

  const list = document.createElement("ul");
  const downloadItem = document.createElement("li");
  const download = document.createElement("a");
  download.className = "download";
  download.href = `/files/${encodeURIComponent(lecture.source)}`;
  download.download = lecture.source;
  download.textContent = "⬇ Tải tài liệu (.txt)";
  downloadItem.appendChild(download);
  list.appendChild(downloadItem);

  for (const section of lecture.sections) {
    const item = document.createElement("li");
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = section;
    // Chỉ điền sẵn, không tự gửi: tiết kiệm quota Gemini
    button.addEventListener("click", () => {
      input.value = `Giải thích mục "${section}" trong bài ${title}`;
      input.focus();
    });
    item.appendChild(button);
    list.appendChild(item);
  }
  details.append(summary, list);
  return details;
}

async function loadToc() {
  const toc = document.getElementById("toc");
  try {
    const response = await fetch("/toc");
    if (!response.ok) throw new Error(response.status);
    const lectures = await response.json();
    toc.replaceChildren(...lectures.map(renderLecture));
  } catch {
    toc.textContent = "Không tải được mục lục.";
  }
}

loadToc();
</script>
</body>
</html>
